<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Range-extender / plug-in hybrid (EREV, PHEV): engine block split diagonally —
       outlined electric half with a bolt, filled fuel half with a pump cut out -->
  <defs>
    <clipPath id="electric"><path d="M0 0h19L13 32H0Z"/></clipPath>
    <clipPath id="fuel"><path d="M19 0h13v32H13Z"/></clipPath>
    <mask id="pump">
      <rect width="32" height="32" fill="#fff"/>
      <rect x="18.4" y="14.2" width="4.2" height="7.6" rx=".6" fill="#000"/>
      <path d="M22.6 16.2h1.1a.8.8 0 0 1 .8.8v3.4" fill="none" stroke="#000" stroke-width="1.1" stroke-linecap="round"/>
    </mask>
  </defs>
  <g clip-path="url(#electric)" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round">
    <rect x="11.9" y="5.9" width="8.2" height="1" rx=".5"/>
    <path d="M15.7 7.4v2.6M9.5 10h11.2l2.4 3H25v-2h3v11h-3v-2h-1.9v4.2L20.4 27h-8l-2.9-3H8v-3.5H6V24H3V13h3v3.5h2V12Z"/>
  </g>
  <path clip-path="url(#electric)" d="M12.6 13.2 9 18.4h2.6l-1 4.2 4-5.6h-2.7l.9-3.8Z"/>
  <g clip-path="url(#fuel)" mask="url(#pump)">
    <rect x="11" y="5" width="10" height="2.6" rx="1"/>
    <rect x="14.8" y="7.4" width="2.4" height="3"/>
    <path d="M9.5 10h11.2l2.4 3H25v-2h3v11h-3v-2h-1.9v4.2L20.4 27h-8l-2.9-3H8v-3.5H6V24H3V13h3v3.5h2V12Z"/>
  </g>
</svg>
